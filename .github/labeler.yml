# One support-path union must match every file, including rename origins.
# CI, release tooling, tests and documentation are support-only changes.
omit-from-release-notes:
  - changed-files:
      - all-globs-to-all-files:
          - '{.github/**,scripts/release/**,src/test/**,images/scylla-cdc-source-connector-control-center{1..10}.png,**/*.md,Makefile,.gitignore,renovate.json}'
