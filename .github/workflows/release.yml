name: Release

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests during validation; release helper tests always run'
        default: false

      target-tag:
        type: string
        description: 'target-tag: re-release a compatible semver tag; unsafe historical targets are rejected'
        default: master

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

jobs:
  release-tooling:
    name: Release tooling checks
    permissions:
      contents: read
    uses: ./.github/workflows/release-credential-safety.yml

  validate:
    name: Pre-release checks
    needs: release-tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      target-sha: ${{ steps.target.outputs.target-sha }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/check-blockers.sh

      - name: Validate release target
        id: target
        uses: ./.github/actions/release-validate
        with:
          target-tag: ${{ inputs.target-tag }}
          release-version: ${{ inputs.release-version }}
          skip-tests: ${{ inputs.skip-tests }}

      - name: Recheck for open release blockers before approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-safety/check-blockers.sh"

      - name: Summarize pre-release checks
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pre-release checks passed

          Release inputs, tooling, target policy, and the unsigned release build passed.
          Project tests ran unless skip-tests was selected.

          The Release job now requires approval for the protected release environment.
          Signing and publishing credentials are only used after approval.
          EOF

      - name: Upload sanitized validation-stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized validation-stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    # Let pre-release checks run independently; serialize only credentialed work.
    # Never cancel an in-progress signing or publishing job.
    concurrency:
      group: connector-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/check-blockers.sh

      - name: Prepare signed release
        uses: ./.github/actions/release-prepare
        with:
          target-tag: ${{ inputs.target-tag }}
          target-sha: ${{ needs.validate.outputs.target-sha }}
          release-version: ${{ inputs.release-version }}
          signing-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          sonatype-token-username: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          sonatype-token-password: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}

      - name: Recheck for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-safety/check-blockers.sh"

      - name: Recheck master before publication
        if: inputs.target-tag == 'master'
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if [[ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_BASE_COMMIT" ]]; then
            echo "::error::master advanced after release preparation; start a new release workflow."
            exit 1
          fi

      - name: Perform release
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release

      - name: Push changes to SCM
        if: inputs.target-tag == 'master'
        run: |
          git status && git log -3
          git push origin --follow-tags -v HEAD:refs/heads/master

      - name: Sign and verify GitHub assets
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 "$RUNNER_TEMP/release-safety/assets.py" sign

      - name: Create GitHub Release
        if: inputs.target-tag == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" github-release

      # A notification failure must not obscure successful publication. Recover
      # notification separately; a fresh release dispatch would cut a new version.
      - name: Extract release version
        id: extract-version
        if: inputs.target-tag == 'master'
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/release-safety/assets.py" identity >> "$GITHUB_ENV"

      - name: Notify Confluent Hub
        id: notify-confluent
        if: inputs.target-tag == 'master' && steps.extract-version.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: drivers-team-bot@scylladb.com
          to: confluent-hub@confluent.io
          cc: drivers-team@scylladb.com
          subject: "Publish scylla-cdc-source-connector ${{ env.RELEASE_VERSION }}"
          body: |
            Dear CCET Team,

            Please publish version ${{ env.RELEASE_VERSION }} of scylla-cdc-source-connector:
            https://github.com/scylladb/scylla-cdc-source-connector/releases/download/${{ env.RELEASE_TAG }}/scylladb-scylla-cdc-source-connector-${{ env.RELEASE_VERSION }}.zip

            Best regards,
            Drivers Team at ScyllaDB

      - name: Open fallback issue if Confluent was not notified
        if: inputs.target-tag == 'master' && (steps.extract-version.outcome == 'failure' || steps.notify-confluent.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<EOF
          The automated notification to Confluent failed during the release of
          \`${RELEASE_TAG:-unknown tag}\`
          ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).
          The release itself succeeded — only the email did not go out.

          **Do not re-run the Release workflow.** Send the message below by hand,
          then close this issue.

          To: confluent-hub@confluent.io
          CC: drivers-team@scylladb.com
          Subject: Publish scylla-cdc-source-connector ${RELEASE_VERSION}

          Dear CCET Team,

          Please publish version ${RELEASE_VERSION} of scylla-cdc-source-connector:
          https://github.com/scylladb/scylla-cdc-source-connector/releases/download/${RELEASE_TAG}/scylladb-scylla-cdc-source-connector-${RELEASE_VERSION}.zip

          Best regards,
          Drivers Team at ScyllaDB
          EOF
          )
          # Annotate and record before creating the issue: the summary write cannot
          # fail, so the message survives even when the issue API does not.
          echo "::warning::Confluent Hub was not notified automatically; see the run summary."
          printf '%s\n' "$BODY" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --assignee "${GITHUB_ACTOR}" \
            --title "Manual action: notify Confluent Hub about ${RELEASE_TAG:-the latest release}" \
            --body "$BODY"

      - name: Upload sanitized stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
          retention-days: 7
