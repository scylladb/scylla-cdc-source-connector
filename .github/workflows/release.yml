name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests during validation; release helper tests always run'
        default: false

      target-tag:
        type: string
        description: 'target-tag: re-release a compatible semver tag; unsafe historical targets are rejected'
        default: master

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

# Only one release may prepare/publish at a time; never cancel a publishing job.
concurrency:
  group: connector-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/check-blockers.sh

      - name: Set up validation Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Maven 3.9.16
        run: bash scripts/release/setup-maven.sh

      - name: Validate release tooling
        run: |
          python3 scripts/release/guard.py check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Preserve validation guard
        run: bash scripts/release/preserve-tools.sh

      - name: Resolve validation target
        id: target
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TARGET_TAG" != master ]]; then
            if [[ ! "$RELEASE_TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported target tag; expected master or vX.Y.Z"
              exit 1
            fi
            git checkout --detach "refs/tags/$RELEASE_TARGET_TAG~1" --
          fi
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"

      - name: Validate target without release credentials
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          python3 "$RELEASE_GUARD" check
          if [[ "$RELEASE_SKIP_TESTS" == true ]]; then
            export MAVEN_OPTS="${MAVEN_OPTS:-} -DskipTests=true -DskipITs=true"
          fi
          python3 "$RELEASE_GUARD" run mvn -B --no-transfer-progress -Prelease -Dgpg.skip=true verify

      - name: Upload sanitized validation-stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized validation-stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve release guard
        run: bash scripts/release/preserve-tools.sh

      - name: Checkout release target
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.target-sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$RELEASE_TARGET_COMMIT"
          if [[ "$RELEASE_TARGET_TAG" == master ]]; then
            git fetch --no-tags origin master
            if [[ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_TARGET_COMMIT" ]]; then
              echo "master advanced after validation; start a new release workflow."
              exit 1
            fi
            git checkout -B master "$RELEASE_TARGET_COMMIT" --
          else
            git checkout --detach "$RELEASE_TARGET_COMMIT" --
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TARGET_TAG"; then
              git tag -d -- "$RELEASE_TARGET_TAG"
            fi
          fi

      - name: Check release credential safety before importing credentials
        run: python3 "$RUNNER_TEMP/release-safety/guard.py" check

      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-safety/check-blockers.sh"

      - name: Reject missing or placeholder Sonatype tokens
        env:
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: python3 "$RUNNER_TEMP/release-safety/assets.py" check-tokens

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: temurin
          server-id: central
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD

      - name: Set up Maven 3.9.16
        run: bash "$RUNNER_TEMP/release-safety/setup-maven.sh"

      - name: Prepare release
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_SKIP_TESTS: 'true'
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          baseline=$(git rev-parse HEAD)
          export RELEASE_BASE_COMMIT="$baseline"
          echo "RELEASE_BASE_COMMIT=$baseline" >> "$GITHUB_ENV"
          make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release-prepare

      - name: Verify prepared release commits and tag with public key only
        run: python3 "$RUNNER_TEMP/release-safety/signing.py" verify-prepared

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-safety/check-blockers.sh"

      - name: Perform release
        if: inputs.dry-run == false
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release

      - name: Push changes to SCM
        if: inputs.dry-run == false && inputs.target-tag == 'master'
        run: |
          git status && git log -3
          git push origin --follow-tags -v HEAD:refs/heads/master

      - name: Perform release dry-run
        if: inputs.dry-run == true
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release-dry-run

      - name: Sign and verify GitHub assets
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 "$RUNNER_TEMP/release-safety/assets.py" sign

      - name: Create GitHub Release
        if: inputs.dry-run == false && inputs.target-tag == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" github-release

      # Notification steps are continue-on-error: a bounced email must not turn a
      # published release red, because a red release invites a re-run, and
      # re-running preparation calls mvn release:prepare again and
      # cuts a spurious version.
      - name: Extract release version
        id: extract-version
        if: inputs.dry-run == false && inputs.target-tag == 'master'
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/release-safety/assets.py" identity >> "$GITHUB_ENV"

      - name: Notify Confluent Hub
        id: notify-confluent
        if: inputs.dry-run == false && inputs.target-tag == 'master' && steps.extract-version.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: drivers-team-bot@scylladb.com
          to: confluent-hub@confluent.io
          cc: drivers-team@scylladb.com
          subject: "Publish scylla-cdc-source-connector ${{ env.RELEASE_VERSION }}"
          body: |
            Dear CCET Team,

            Please publish version ${{ env.RELEASE_VERSION }} of scylla-cdc-source-connector:
            https://github.com/scylladb/scylla-cdc-source-connector/releases/download/${{ env.RELEASE_TAG }}/scylladb-scylla-cdc-source-connector-${{ env.RELEASE_VERSION }}.zip

            Best regards,
            Drivers Team at ScyllaDB

      - name: Open fallback issue if Confluent was not notified
        if: inputs.dry-run == false && inputs.target-tag == 'master' && (steps.extract-version.outcome == 'failure' || steps.notify-confluent.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<EOF
          The automated notification to Confluent failed during the release of
          \`${RELEASE_TAG:-unknown tag}\`
          ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).
          The release itself succeeded — only the email did not go out.

          **Do not re-run the Release workflow.** It would call \`mvn release:prepare\`
          again and cut an extra version. Send the message below by hand, then close
          this issue.

          To: confluent-hub@confluent.io
          CC: drivers-team@scylladb.com
          Subject: Publish scylla-cdc-source-connector ${RELEASE_VERSION}

          Dear CCET Team,

          Please publish version ${RELEASE_VERSION} of scylla-cdc-source-connector:
          https://github.com/scylladb/scylla-cdc-source-connector/releases/download/${RELEASE_TAG}/scylladb-scylla-cdc-source-connector-${RELEASE_VERSION}.zip

          Best regards,
          Drivers Team at ScyllaDB
          EOF
          )
          # Annotate and record before creating the issue: the summary write cannot
          # fail, so the message survives even when the issue API does not.
          echo "::warning::Confluent Hub was not notified automatically; see the run summary."
          printf '%s\n' "$BODY" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --assignee "${GITHUB_ACTOR}" \
            --title "Manual action: notify Confluent Hub about ${RELEASE_TAG:-the latest release}" \
            --body "$BODY"

      - name: Upload sanitized stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
          retention-days: 7
