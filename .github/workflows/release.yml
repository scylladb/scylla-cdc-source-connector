name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: do not run tests while releasing'
        default: false

      target-tag:
        type: string
        description: 'target-tag: tag or branch name to release. Use to to re-release failed releases'
        default: master

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    env:
      MVNCMD: mvn -B -X -ntp

    steps:
      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "${blocker}" ]]; then
            blocker_title=$(jq -r '.title' <<< "${blocker}")
            blocker_url=$(jq -r '.url' <<< "${blocker}")
            echo "::error title=Release blocked::${blocker_title} (${blocker_url})"
            echo "Open release blocker: ${blocker_title} (${blocker_url})"
            exit 1
          fi
          echo "No open release blockers found."

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout Code One Commit Before ${{ inputs.target-tag }}
        if: inputs.target-tag != 'master'
        run: |
          if [[ "${{ inputs.target-tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git fetch --prune --unshallow || true
            git checkout ${{ inputs.target-tag }}~1
            git tag -d ${{ inputs.target-tag }}
          else
            echo "Skipping: ${{ inputs.target-tag }} is not a semver tag"
          fi

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin
          server-id: central
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD
          cache: maven

      - name: Configure Git user
        run: |
          git config user.name "ScyllaDB Promoter"
          git config user.email "github-promoter@scylladb.com"

      - name: Clean project
        run: $MVNCMD clean

      - name: Clean release
        run: $MVNCMD release:clean

      - name: Prepare release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
            MAVEN_OPTS="${MAVEN_OPTS} -DskipTests=true -DskipITs=true"
          fi
          NEXT_RELEASE=""
          if [[ "${{ inputs.release-version }}" != "" ]]; then
            NEXT_RELEASE="-DreleaseVersion=${{ inputs.release-version }}"
          fi
          export MAVEN_OPTS
          $MVNCMD release:prepare -DpushChanges=false ${NEXT_RELEASE} -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}

      - name: Perform release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          CMD_OPTS=""
          if [[ "${{ inputs.dry-run }}" != "true" ]]; then
            CMD_OPTS="-Drelease.autopublish=true"
          fi
          if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
            MAVEN_OPTS="${MAVEN_OPTS} -DskipTests=true -DskipITs=true"
          fi
          export MAVEN_OPTS
          $MVNCMD release:perform $CMD_OPTS -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }} > >(tee /tmp/logs-stdout.log) 2> >(tee /tmp/logs-stderr.log)

      - name: Upload stdout.log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-stdout
          path: /tmp/logs-stdout.log

      - name: Upload stderr.log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-stderr
          path: /tmp/logs-stderr.log

      - name: Push changes to SCM
        if: inputs.dry-run == false && inputs.target-tag == 'master'
        run: |
          git status && git log -3
          git push origin --follow-tags -v

      - name: Create GitHub Release
        if: inputs.dry-run == false && inputs.target-tag == 'master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release

      # Every step below is continue-on-error: a bounced email must not turn a
      # published release red, because a red release invites a re-run, and
      # re-running this single-job workflow calls mvn release:prepare again and
      # cuts a spurious version.
      - name: Extract release version
        id: extract-version
        if: inputs.dry-run == false && inputs.target-tag == 'master'
        continue-on-error: true
        run: |
          RELEASE_TAG=$(git describe --tags --abbrev=0)
          # Exported before validation so the fallback issue can quote what was found.
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::unexpected release tag '${RELEASE_TAG}'; skipping the Confluent email"
            exit 1
          fi

      - name: Notify Confluent Hub
        id: notify-confluent
        if: inputs.dry-run == false && inputs.target-tag == 'master' && steps.extract-version.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: drivers-team-bot@scylladb.com
          to: confluent-hub@confluent.io
          cc: drivers-team@scylladb.com
          subject: "Publish scylla-cdc-source-connector ${{ env.RELEASE_VERSION }}"
          body: |
            Dear CCET Team,

            Please publish version ${{ env.RELEASE_VERSION }} of scylla-cdc-source-connector:
            https://github.com/scylladb/scylla-cdc-source-connector/releases/download/${{ env.RELEASE_TAG }}/scylladb-scylla-cdc-source-connector-${{ env.RELEASE_VERSION }}.zip

            Best regards,
            Drivers Team at ScyllaDB

      - name: Open fallback issue if Confluent was not notified
        if: inputs.dry-run == false && inputs.target-tag == 'master' && (steps.extract-version.outcome == 'failure' || steps.notify-confluent.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<EOF
          The automated notification to Confluent failed during the release of
          \`${RELEASE_TAG:-unknown tag}\`
          ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).
          The release itself succeeded — only the email did not go out.

          **Do not re-run the Release workflow.** It would call \`mvn release:prepare\`
          again and cut an extra version. Send the message below by hand, then close
          this issue.

          To: confluent-hub@confluent.io
          CC: drivers-team@scylladb.com
          Subject: Publish scylla-cdc-source-connector ${RELEASE_VERSION}

          Dear CCET Team,

          Please publish version ${RELEASE_VERSION} of scylla-cdc-source-connector:
          https://github.com/scylladb/scylla-cdc-source-connector/releases/download/${RELEASE_TAG}/scylladb-scylla-cdc-source-connector-${RELEASE_VERSION}.zip

          Best regards,
          Drivers Team at ScyllaDB
          EOF
          )
          # Annotate and record before creating the issue: the summary write cannot
          # fail, so the message survives even when the issue API does not.
          echo "::warning::Confluent Hub was not notified automatically; see the run summary."
          printf '%s\n' "$BODY" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --assignee "${GITHUB_ACTOR}" \
            --title "Manual action: notify Confluent Hub about ${RELEASE_TAG:-the latest release}" \
            --body "$BODY"
