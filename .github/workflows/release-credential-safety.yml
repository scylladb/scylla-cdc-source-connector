name: Release credential safety

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-credential-safety:
    name: Release credential safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/release.yml
      - run: python3 scripts/release/guard.py check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
