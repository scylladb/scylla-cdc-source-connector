name: Release credential safety

on:
  workflow_call:
  # Source-only changes are checked by the release pipelines before approval.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - '.github/workflows/release-credential-safety.yml'
      - '.github/workflows/label-release-notes.yml'
      - '.github/workflows/call_jira_sync.yml'
      - '.github/actions/release-*/**'
      - '.github/scripts/**'
      - '.github/package*.json'
      - '.github/labeler.yml'
      - '.github/release.yml'
      - 'scripts/release/**'
      - 'Makefile'
      - '.mvn/**'
      - 'pom.xml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - '.github/workflows/release-credential-safety.yml'
      - '.github/workflows/label-release-notes.yml'
      - '.github/workflows/call_jira_sync.yml'
      - '.github/actions/release-*/**'
      - '.github/scripts/**'
      - '.github/package*.json'
      - '.github/labeler.yml'
      - '.github/release.yml'
      - 'scripts/release/**'
      - 'Makefile'
      - '.mvn/**'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint and release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/release.yml .github/workflows/release-dry-run.yml .github/workflows/label-release-notes.yml .github/workflows/release-credential-safety.yml .github/workflows/call_jira_sync.yml
      - run: python3 scripts/release/guard.py check

  python-tests:
    name: Release helpers (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: capture
            modules: test_capture
          - suite: signing
            modules: test_signing
          - suite: policy-and-commands
            modules: test_assets test_commands test_github_release test_guard test_workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up signing test Java
        if: matrix.suite == 'signing'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up signing test Maven
        if: matrix.suite == 'signing'
        run: bash scripts/release/setup-maven.sh
      - name: Test release helpers
        env:
          PYTHONPATH: scripts/release
          TEST_MODULES: ${{ matrix.modules }}
        # Each group runs in its own runner: tests mutate cwd, env and process state.
        run: |
          read -r -a modules <<< "$TEST_MODULES"
          python3 -m unittest -v "${modules[@]}"

  javascript-tests:
    name: Release automation JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix .github
      - run: node --test .github/scripts/*.test.cjs
