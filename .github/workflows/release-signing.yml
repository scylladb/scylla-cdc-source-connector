name: Release signing
on:
  pull_request:
    paths: ['scripts/release/**', '.github/workflows/*release*', 'Makefile', 'build.sbt']
  push:
    branches: [master]
    paths: ['scripts/release/**', '.github/workflows/*release*', 'Makefile', 'build.sbt']
permissions:
  contents: read
jobs:
  release-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: python3 -m unittest discover -s scripts/release -p 'test_signing.py' -v
