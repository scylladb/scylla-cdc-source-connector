name: PR Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    name: ${{ matrix.kafka_provider }} ${{ matrix.kafka_version }} (${{ matrix.kafka_connect_mode }}), ScyllaDB ${{ matrix.scylla_version }}

    permissions:
      contents: read
      checks: write

    # The versions tested before this workflow was split up. Moving to the version aliases
    # resolve-kafka-version / resolve-scylla-version support is tracked in DRIVER-1176.
    strategy:
      fail-fast: false
      matrix:
        include:
          - kafka_provider: confluent
            kafka_version: "8.0.0"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: confluent
            kafka_version: "7.9.2"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: confluent
            kafka_version: "7.8.3"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: confluent
            kafka_version: "7.7.4"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: confluent
            kafka_version: "7.6.6"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: debezium
            kafka_version: "3.4.1"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: apache
            kafka_version: "4.0.0"
            kafka_connect_mode: distributed
            scylla_version: "6.2"
          - kafka_provider: apache
            kafka_version: "4.0.0"
            kafka_connect_mode: standalone
            scylla_version: "6.2"

    uses: ./.github/workflows/lib-integration-test.yml
    with:
      kafka_provider: ${{ matrix.kafka_provider }}
      kafka_version: ${{ matrix.kafka_version }}
      kafka_connect_mode: ${{ matrix.kafka_connect_mode }}
      scylla_version: ${{ matrix.scylla_version }}
