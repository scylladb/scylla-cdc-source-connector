name: PR Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    name: ${{ matrix.kafka_provider }} ${{ matrix.kafka_version }} (${{ matrix.kafka_connect_mode }}), ScyllaDB ${{ matrix.scylla_version }}

    permissions:
      contents: read
      checks: write

    # Versions are aliases resolved at run time (see the Makefile), so the matrix follows new
    # releases without edits. ScyllaDB versions rotate so that every alias is covered once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - kafka_provider: confluent
            kafka_version: LATEST
            kafka_connect_mode: distributed
            scylla_version: LATEST
          - kafka_provider: confluent
            kafka_version: PREVIOUS
            kafka_connect_mode: distributed
            scylla_version: LTS-LATEST
          - kafka_provider: confluent
            kafka_version: 7-LATEST
            kafka_connect_mode: distributed
            scylla_version: LTS-PRIOR
          - kafka_provider: confluent
            kafka_version: LATEST
            kafka_connect_mode: standalone
            scylla_version: LATEST
          - kafka_provider: apache
            kafka_version: LATEST
            kafka_connect_mode: distributed
            scylla_version: LATEST
          - kafka_provider: apache
            kafka_version: PREVIOUS
            kafka_connect_mode: distributed
            scylla_version: LTS-LATEST
          - kafka_provider: apache
            kafka_version: 3-LATEST
            kafka_connect_mode: distributed
            scylla_version: LTS-PRIOR
          - kafka_provider: apache
            kafka_version: LATEST
            kafka_connect_mode: standalone
            scylla_version: LATEST
          - kafka_provider: debezium
            kafka_version: LATEST
            kafka_connect_mode: distributed
            scylla_version: LATEST

    uses: ./.github/workflows/lib-integration-test.yml
    with:
      kafka_provider: ${{ matrix.kafka_provider }}
      kafka_version: ${{ matrix.kafka_version }}
      kafka_connect_mode: ${{ matrix.kafka_connect_mode }}
      scylla_version: ${{ matrix.scylla_version }}
